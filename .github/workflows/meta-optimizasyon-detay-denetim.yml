name: Meta Optimizasyon Detay Denetim

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reklam performansini salt okunur analiz et
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.parse, urllib.request, urllib.error
          API = "https://graph.facebook.com/v26.0"
          TOKEN = os.environ["META_USER_TOKEN"]
          ACCOUNT = "act_1075711764208044"

          def get(path, **params):
              params["access_token"] = TOKEN
              url = API + path + "?" + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url, timeout=90) as r:
                      return json.load(r)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  try: err = json.loads(raw).get("error", {})
                  except Exception: err = {}
                  return {"_error": {"http": exc.code, "code": err.get("code"), "subcode": err.get("error_subcode"), "message": err.get("message")}}

          tr_last = json.dumps({"since":"2026-10-04","until":"2026-10-10"})
          tr_prev = json.dumps({"since":"2026-09-27","until":"2026-10-03"})
          fields = "campaign_id,campaign_name,adset_id,adset_name,ad_id,ad_name,spend,impressions,reach,frequency,clicks,inline_link_clicks,actions,cost_per_action_type,cpm,ctr,cpc"
          report = {
            "account": get(f"/{ACCOUNT}", fields="id,name,account_status,disable_reason,currency,timezone_name,amount_spent,spend_cap,balance"),
            "campaigns": get(f"/{ACCOUNT}/campaigns", fields="id,name,status,effective_status,objective,daily_budget,lifetime_budget,start_time,stop_time,updated_time", limit=100),
            "adsets": get(f"/{ACCOUNT}/adsets", fields="id,name,campaign_id,status,effective_status,daily_budget,lifetime_budget,budget_remaining,start_time,end_time,updated_time,optimization_goal,billing_event,bid_strategy,destination_type,promoted_object,targeting", limit=100),
            "ads": get(f"/{ACCOUNT}/ads", fields="id,name,adset_id,campaign_id,status,effective_status,updated_time,creative{id,name,title,body,call_to_action_type,object_story_spec,asset_feed_spec}", limit=100),
            "last7_ads": get(f"/{ACCOUNT}/insights", fields=fields, time_range=tr_last, level="ad", limit=500),
            "prev7_ads": get(f"/{ACCOUNT}/insights", fields=fields, time_range=tr_prev, level="ad", limit=500),
            "daily14_campaign": get(f"/{ACCOUNT}/insights", fields="campaign_id,campaign_name,spend,impressions,reach,clicks,inline_link_clicks,actions,cost_per_action_type", time_range=json.dumps({"since":"2026-09-27","until":"2026-10-10"}), time_increment=1, level="campaign", limit=500),
            "last7_age_gender": get(f"/{ACCOUNT}/insights", fields="campaign_id,campaign_name,adset_id,adset_name,spend,impressions,reach,inline_link_clicks,actions,cost_per_action_type", time_range=tr_last, level="adset", breakdowns="age,gender", limit=500),
            "last7_placement": get(f"/{ACCOUNT}/insights", fields="campaign_id,campaign_name,adset_id,adset_name,spend,impressions,reach,inline_link_clicks,actions,cost_per_action_type", time_range=tr_last, level="adset", breakdowns="publisher_platform,platform_position", limit=500),
          }
          print("META_OPT_AUDIT_BEGIN")
          print(json.dumps(report, ensure_ascii=False))
          print("META_OPT_AUDIT_END")
          if report["account"].get("_error"):
              raise SystemExit(2)
          PYCODE
