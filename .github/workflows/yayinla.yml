name: Otomatik Yayın

# Saatler UTC. İstanbul: 09:00 / 12:30 / 19:30
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 9 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force_ids:
        description: 'Zorla yayınlanacak program kimlikleri (virgülle)'
        required: false
        type: string
      force_republish:
        description: 'Daha önce yayınlanmış olsa da tekrar yayınla'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sosyal-medya-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zamanı gelen yayınları yap
        run: python yayinla.py
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          REPO: ${{ github.repository }}
          FORCE_IDS: ${{ inputs.force_ids }}
          FORCE_REPUBLISH: ${{ inputs.force_republish && '1' || '0' }}
      - name: Yayın durumunu depoya kaydet
        if: always()
        run: |
          if git diff --quiet -- schedule.json published.json; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi
          git config user.name "beyoglu-yayin-botu"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json published.json
          git commit -m "yayın durumunu güncelle"
          git push
