name: Meta Yerel WhatsApp Optimizasyon Testi

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-yerel-optimizasyon
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yerel WhatsApp kampanyasini guvenli butceyle kur
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          API = "https://graph.facebook.com/v26.0"
          TOKEN = os.environ["META_USER_TOKEN"]
          ACCOUNT = "act_1075711764208044"
          PAGE_ID = "1238350856017634"
          WHATSAPP = "905461122797"
          BEST_CREATIVE = "1919541966089407"
          OLD_CAMPAIGN = "120248582918690157"
          OLD_ADSET = "120248582918630157"
          OLD_START_RULE = "928364303359690"
          OLD_STOP_RULE = "1094300663320832"

          def get(object_id, fields):
              q = urllib.parse.urlencode({"fields": fields, "access_token": TOKEN})
              with urllib.request.urlopen(f"{API}/{object_id}?{q}", timeout=90) as r:
                  return json.load(r)

          def post(object_id, **params):
              body = urllib.parse.urlencode({**params, "access_token": TOKEN}).encode()
              req = urllib.request.Request(f"{API}/{object_id}", data=body, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.load(r)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  try: err = json.loads(raw).get("error", {})
                  except Exception: err = {}
                  raise RuntimeError(f"Meta API HTTP {exc.code}, code={err.get('code')}, subcode={err.get('error_subcode')}, message={str(err.get('message'))[:300]}")

          now = datetime.now(ZoneInfo("Europe/Istanbul"))
          end = now.replace(hour=23, minute=0, second=0, microsecond=0)
          if now >= end - timedelta(minutes=45):
              raise RuntimeError("23:00 bitisine 45 dakikadan az kaldi; guvenli test baslatilmadi")

          account_before = get(ACCOUNT, "id,account_status,disable_reason,currency,amount_spent,spend_cap,balance")
          spent = int(account_before.get("amount_spent") or 0)
          cap = int(account_before.get("spend_cap") or 0)
          remaining = cap - spent
          # User approved the remaining 92.31 TRY test; retain a small 2.31 TRY safety buffer.
          test_budget = min(9000, max(0, remaining - 200))
          if test_budget < 5000:
              raise RuntimeError(f"Guvenli test icin yeterli kalan limit yok; minor_remaining={remaining}")

          created = {}
          try:
              # Clean the already-expired campaign and its stale schedule rules so it cannot compete.
              post(OLD_CAMPAIGN, status="PAUSED")
              post(OLD_ADSET, status="PAUSED")
              post(OLD_START_RULE, status="DISABLED")
              post(OLD_STOP_RULE, status="DISABLED")

              campaign = post(
                  f"{ACCOUNT}/campaigns",
                  name="OPT-WA-Gaziantep-Yerel-90TL-2026-10-11",
                  objective="OUTCOME_ENGAGEMENT",
                  buying_type="AUCTION",
                  special_ad_categories=json.dumps([]),
                  status="PAUSED",
              )
              created["campaign_id"] = campaign["id"]

              targeting = {
                  "age_min": 30,
                  "age_max": 55,
                  "geo_locations": {
                      "places": [{
                          "key": "105841367912978",
                          "radius": 11,
                          "distance_unit": "kilometer"
                      }],
                      "medium_geo_areas": [{"key": "2328021"}],
                      "location_types": ["frequently_in", "home", "recent"]
                  },
                  "locales": [19],
                  "publisher_platforms": ["facebook"],
                  "facebook_positions": ["feed"],
                  "device_platforms": ["mobile"],
                  "targeting_automation": {"advantage_audience": 1}
              }
              adset = post(
                  f"{ACCOUNT}/adsets",
                  name="Gaziantep-Sahinbey-Sehitkamil-30-55-FBFeed-WA",
                  campaign_id=campaign["id"],
                  lifetime_budget=str(test_budget),
                  billing_event="IMPRESSIONS",
                  optimization_goal="LEAD_GENERATION",
                  bid_strategy="LOWEST_COST_WITHOUT_CAP",
                  destination_type="WHATSAPP",
                  promoted_object=json.dumps({
                      "page_id": PAGE_ID,
                      "whatsapp_phone_number": WHATSAPP,
                      "smart_pse_enabled": False
                  }),
                  targeting=json.dumps(targeting),
                  start_time=now.isoformat(timespec="seconds"),
                  end_time=end.isoformat(timespec="seconds"),
                  status="PAUSED",
              )
              created["adset_id"] = adset["id"]

              ad = post(
                  f"{ACCOUNT}/ads",
                  name="Yerel-WhatsApp-En-Iyi-Kreatif-Test",
                  adset_id=adset["id"],
                  creative=json.dumps({"creative_id": BEST_CREATIVE}),
                  status="PAUSED",
              )
              created["ad_id"] = ad["id"]

              # Activate from leaf to root so incomplete structures never spend.
              post(ad["id"], status="ACTIVE")
              post(adset["id"], status="ACTIVE")
              post(campaign["id"], status="ACTIVE")

              verification = {
                  "campaign": get(campaign["id"], "id,name,status,effective_status,objective,start_time,stop_time"),
                  "adset": get(adset["id"], "id,name,status,effective_status,lifetime_budget,budget_remaining,start_time,end_time,optimization_goal,billing_event,bid_strategy,destination_type,targeting"),
                  "ad": get(ad["id"], "id,name,status,effective_status,creative{id,name,title,call_to_action_type}"),
                  "expired_campaign": get(OLD_CAMPAIGN, "id,name,status,effective_status"),
                  "expired_adset": get(OLD_ADSET, "id,name,status,effective_status"),
                  "old_start_rule": get(OLD_START_RULE, "id,name,status"),
                  "old_stop_rule": get(OLD_STOP_RULE, "id,name,status"),
                  "account_after": get(ACCOUNT, "id,account_status,disable_reason,currency,amount_spent,spend_cap,balance"),
                  "approved_test_budget_minor": test_budget,
                  "safe_limit_remaining_before_minor": remaining,
                  "created_at": now.isoformat(),
                  "ends_at": end.isoformat(),
              }
              ok = (
                  verification["campaign"].get("status") == "ACTIVE"
                  and verification["adset"].get("status") == "ACTIVE"
                  and verification["ad"].get("status") == "ACTIVE"
                  and verification["expired_campaign"].get("status") == "PAUSED"
                  and verification["old_start_rule"].get("status") == "DISABLED"
                  and int(verification["adset"].get("lifetime_budget") or 0) <= test_budget
              )
              verification["verified"] = ok
              print("META_OPT_SETUP_BEGIN")
              print(json.dumps(verification, ensure_ascii=False, indent=2))
              print("META_OPT_SETUP_END")
              if not ok:
                  raise RuntimeError("Kurulum dogrulamasi basarisiz")
          except Exception:
              # Fail closed: pause anything created before surfacing the error.
              for key in ("ad_id", "adset_id", "campaign_id"):
                  if created.get(key):
                      try: post(created[key], status="PAUSED")
                      except Exception: pass
              raise
          PYCODE
