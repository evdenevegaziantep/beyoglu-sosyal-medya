name: Meta Pahali WPP Kampanyasini Durdur

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-wpp-guvenli-durdur
  cancel-in-progress: false

jobs:
  durdur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pahali eski kampanyayi ve kurallarini guvenle durdur
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.parse, urllib.request

          API = "https://graph.facebook.com/v26.0"
          TOKEN = os.environ["META_USER_TOKEN"]
          CAMPAIGN = "120248369110360157"
          ADSET = "120248369110370157"
          START_RULE = "1453196156652913"
          STOP_RULE = "1425577452867947"

          def post(object_id, **params):
              data = urllib.parse.urlencode({**params, "access_token": TOKEN}).encode()
              req = urllib.request.Request(f"{API}/{object_id}", data=data, method="POST")
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          def get(object_id, fields):
              q = urllib.parse.urlencode({"fields": fields, "access_token": TOKEN})
              with urllib.request.urlopen(f"{API}/{object_id}?{q}", timeout=90) as response:
                  return json.load(response)

          post(CAMPAIGN, status="PAUSED")
          post(ADSET, status="PAUSED")
          post(START_RULE, status="DISABLED")
          post(STOP_RULE, status="DISABLED")

          campaign = get(CAMPAIGN, "id,name,status,effective_status")
          adset = get(ADSET, "id,name,status,effective_status")
          start_rule = get(START_RULE, "id,name,status")
          stop_rule = get(STOP_RULE, "id,name,status")

          safe = (
              campaign.get("status") == "PAUSED"
              and adset.get("status") == "PAUSED"
              and start_rule.get("status") == "DISABLED"
              and stop_rule.get("status") == "DISABLED"
          )
          print("campaign_status=", campaign.get("status"), campaign.get("effective_status"))
          print("adset_status=", adset.get("status"), adset.get("effective_status"))
          print("start_rule_status=", start_rule.get("status"))
          print("stop_rule_status=", stop_rule.get("status"))
          print("safe_pause_verified=", safe)
          if not safe:
              raise SystemExit(2)
          PYCODE
